  <title>黄紫琦 — Visual / AI / Brand Designer</title>
    <script>
      (() => {
        // GitHub Pages 项目站点部署在 /already/ 子目录时，兼容旧版根路径资源。
        const repoBase = location.pathname.startsWith('/already/') ? '/already' : '';
        if (!repoBase) return;
        const rewrite = (value) => {
          if (typeof value !== 'string') return value;
          return /^\/(?:profile|certificates|tank-game|plane-game)(?:\/|$)/.test(value)
            ? repoBase + value
            : value;
        };
        const patchSrc = (prototype) => {
          const descriptor = Object.getOwnPropertyDescriptor(prototype, 'src');
          if (!descriptor || !descriptor.set) return;
          Object.defineProperty(prototype, 'src', {
            ...descriptor,
            set(value) { descriptor.set.call(this, rewrite(value)); },
          });
        };
        patchSrc(window.HTMLImageElement.prototype);
        patchSrc(window.HTMLMediaElement.prototype);
        patchSrc(window.HTMLSourceElement.prototype);
        const posterDescriptor = Object.getOwnPropertyDescriptor(window.HTMLVideoElement.prototype, 'poster');
        if (posterDescriptor && posterDescriptor.set) {
          Object.defineProperty(window.HTMLVideoElement.prototype, 'poster', {
            ...posterDescriptor,
            set(value) { posterDescriptor.set.call(this, rewrite(value)); },
          });
        }
        const hrefDescriptor = Object.getOwnPropertyDescriptor(window.HTMLAnchorElement.prototype, 'href');
        if (hrefDescriptor && hrefDescriptor.set) {
          Object.defineProperty(window.HTMLAnchorElement.prototype, 'href', {
            ...hrefDescriptor,
            set(value) { hrefDescriptor.set.call(this, rewrite(value)); },
          });
        }
        const originalSetAttribute = window.Element.prototype.setAttribute;
        window.Element.prototype.setAttribute = function (name, value) {
          const lowerName = String(name).toLowerCase();
          if (lowerName === 'src' || lowerName === 'poster' || lowerName === 'href') {
            value = rewrite(value);
          }
          return originalSetAttribute.call(this, name, value);
        };
        const imageObserver = 'IntersectionObserver' in window
          ? new IntersectionObserver((entries) => entries.forEach(({ target, isIntersecting }) => {
            if (isIntersecting && target.tagName === 'IMG') {
              target.loading = 'eager';
              target.decoding = 'async';
            }
          }), { rootMargin: '480px 0px' })
          : null;
        const rewriteElement = (element) => {
          if (!element || element.nodeType !== 1) return;
          for (const name of ['src', 'poster', 'href']) {
            const value = element.getAttribute(name);
            const next = rewrite(value);
            if (next && next !== value) originalSetAttribute.call(element, name, next);
          }
          if (element.tagName === 'IMG' && element.getAttribute('src')?.includes('/profile/')) {
            element.loading = 'eager';
            element.decoding = 'async';
          }
          if (element.tagName === 'IMG') imageObserver?.observe(element);
          element.querySelectorAll?.('[src], [poster], [href]').forEach(rewriteElement);
        };
        new MutationObserver((mutations) => {
          mutations.forEach(({ addedNodes }) => addedNodes.forEach(rewriteElement));
        }).observe(document.documentElement, { childList: true, subtree: true });
        const fixExistingResources = () => {
          document.querySelectorAll('[src], [poster], [href]').forEach(rewriteElement);
        };
        let attempts = 0;
        const resourceTimer = window.setInterval(() => {
          fixExistingResources();
          if (++attempts >= 20) window.clearInterval(resourceTimer);
        }, 250);
        const startHeroVideo = () => {
          const video = document.querySelector('video.hero-video');
          if (!video) return;
          const source = video.querySelector('source');
          if (source) originalSetAttribute.call(source, 'src', `${repoBase}/profile/resume-background.mp4`);
          originalSetAttribute.call(video, 'poster', `${repoBase}/hero-poster.svg`);
          video.muted = true;
          video.load();
          video.play().catch(() => {});
        };
        window.setTimeout(startHeroVideo, 600);
        window.addEventListener('pointerdown', startHeroVideo, { once: true, passive: true });
        window.addEventListener('touchstart', startHeroVideo, { once: true, passive: true });
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) startHeroVideo();
        });
      })();
    </script>
