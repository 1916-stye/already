<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>张明 · 个人简历</title>
    <style>
        /* ===== CSS Variables & Reset ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-primary: #1e293b;
            --color-primary-light: #334155;
            --color-accent: #3b82f6;
            --color-accent-hover: #2563eb;
            --color-gold: #f59e0b;
            --color-bg: #f1f5f9;
            --color-card: #ffffff;
            --color-text: #0f172a;
            --color-text-secondary: #475569;
            --color-border: #e2e8f0;
            --color-shadow: rgba(15, 23, 42, 0.08);
            --color-shadow-hover: rgba(15, 23, 42, 0.16);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            --max-width: 1120px;
            --nav-height: 68px;
        }

        [data-theme="dark"] {
            --color-primary: #f1f5f9;
            --color-primary-light: #cbd5e1;
            --color-bg: #0f172a;
            --color-card: #1e293b;
            --color-text: #f1f5f9;
            --color-text-secondary: #94a3b8;
            --color-border: #334155;
            --color-shadow: rgba(0, 0, 0, 0.3);
            --color-shadow-hover: rgba(0, 0, 0, 0.5);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            padding-top: var(--nav-height);
        }

        a {
            color: var(--color-accent);
            text-decoration: none;
        }
        a:hover {
            color: var(--color-accent-hover);
        }

        /* ===== Utilities ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--color-accent), transparent);
            margin-left: 0.4rem;
        }

        .badge {
            display: inline-block;
            background: var(--color-accent);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            letter-spacing: 0.02em;
        }

        .tag {
            display: inline-block;
            background: var(--color-border);
            color: var(--color-text-secondary);
            font-size: 0.75rem;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            margin: 0.15rem 0.2rem;
            transition: background var(--transition), color var(--transition);
        }
        [data-theme="dark"] .tag {
            background: #334155;
            color: #cbd5e1;
        }

        .highlight-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--color-accent);
            line-height: 1.2;
        }

        /* ===== Navigation ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: var(--color-card);
            border-bottom: 1px solid var(--color-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.85);
            z-index: 1000;
            display: flex;
            align-items: center;
            transition: background var(--transition), border-color var(--transition);
        }
        [data-theme="dark"] .navbar {
            background: rgba(15, 23, 42, 0.92);
            border-color: #334155;
        }

        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .nav-brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--color-text);
            letter-spacing: -0.02em;
        }
        .nav-brand span {
            color: var(--color-accent);
        }

        .nav-links {
            display: flex;
            gap: 0.6rem 1.2rem;
            flex-wrap: wrap;
            align-items: center;
            list-style: none;
            font-size: 0.9rem;
        }
        .nav-links a {
            color: var(--color-text-secondary);
            font-weight: 500;
            transition: color var(--transition);
            position: relative;
        }
        .nav-links a:hover {
            color: var(--color-accent);
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--color-accent);
            transition: width var(--transition);
        }
        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .nav-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.3rem 0.5rem;
            border-radius: var(--radius-sm);
            color: var(--color-text-secondary);
            transition: background var(--transition), color var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-actions button:hover {
            background: var(--color-border);
            color: var(--color-text);
        }
        [data-theme="dark"] .nav-actions button:hover {
            background: #334155;
        }

        .nav-actions .print-btn {
            font-size: 1rem;
        }

        /* ===== Hero ===== */
        .hero {
            padding: 3rem 0 2.5rem;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.06), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .hero .container {
            position: relative;
            z-index: 1;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 2rem;
            align-items: start;
        }

        .hero-main h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 0.2rem;
        }
        .hero-main h1 span {
            color: var(--color-accent);
        }

        .hero-subtitle {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            margin-bottom: 0.8rem;
        }

        .hero-summary {
            max-width: 640px;
            color: var(--color-text-secondary);
            font-size: 1rem;
            margin-bottom: 1.2rem;
            line-height: 1.7;
        }

        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.6rem;
            margin-bottom: 1.2rem;
        }
        .hero-tags .tag {
            font-size: 0.8rem;
            padding: 0.25rem 1rem;
            background: var(--color-accent);
            color: #fff;
            border-radius: 20px;
            font-weight: 500;
        }
        [data-theme="dark"] .hero-tags .tag {
            background: #2563eb;
            color: #fff;
        }

        .hero-contact {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            align-items: center;
        }
        .hero-contact .contact-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.9rem;
            color: var(--color-text-secondary);
        }
        .hero-contact .contact-item svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--color-accent);
            color: #fff;
            border: none;
            padding: 0.5rem 1.4rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background var(--transition), transform 0.15s;
        }
        .btn-primary:hover {
            background: var(--color-accent-hover);
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: transparent;
            color: var(--color-text-secondary);
            border: 1.5px solid var(--color-border);
            padding: 0.5rem 1.4rem;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn-outline:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
            background: rgba(59, 130, 246, 0.06);
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            min-width: 160px;
            padding-top: 0.4rem;
        }
        .hero-stat-item {
            background: var(--color-card);
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-border);
            text-align: center;
            transition: all var(--transition);
        }
        .hero-stat-item .number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--color-accent);
            line-height: 1.2;
        }
        .hero-stat-item .label {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            font-weight: 500;
        }

        /* ===== Highlights ===== */
        .highlights {
            padding: 1.2rem 0 2rem;
        }
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }
        .highlight-card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 1.2rem 1.2rem 1rem;
            text-align: center;
            transition: all var(--transition);
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px var(--color-shadow-hover);
            border-color: var(--color-accent);
        }
        .highlight-card .number {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--color-accent);
            line-height: 1.2;
        }
        .highlight-card .desc {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            font-weight: 500;
            margin-top: 0.1rem;
        }
        .highlight-card .sub {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            opacity: 0.7;
            margin-top: 0.1rem;
        }

        /* ===== Section Base ===== */
        section {
            padding: 2rem 0;
            scroll-margin-top: var(--nav-height);
        }

        /* ===== Tabs ===== */
        .tabs-container {
            background: var(--color-card);
            border-radius: var(--radius);
            border: 1px solid var(--color-border);
            overflow: hidden;
            transition: background var(--transition), border-color var(--transition);
        }

        .tabs-header {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem;
            padding: 0.6rem 1rem 0;
            border-bottom: 1px solid var(--color-border);
            background: var(--color-bg);
            transition: background var(--transition);
        }
        [data-theme="dark"] .tabs-header {
            background: #0f172a;
        }

        .tabs-header button {
            background: none;
            border: none;
            padding: 0.5rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-text-secondary);
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            font-family: var(--font);
        }
        .tabs-header button:hover {
            color: var(--color-text);
            background: rgba(59, 130, 246, 0.06);
        }
        .tabs-header button[aria-selected="true"] {
            color: var(--color-accent);
            background: var(--color-card);
        }
        .tabs-header button[aria-selected="true"]::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0.8rem;
            right: 0.8rem;
            height: 2.5px;
            background: var(--color-accent);
            border-radius: 2px 2px 0 0;
        }
        [data-theme="dark"] .tabs-header button[aria-selected="true"] {
            background: var(--color-card);
        }

        .tabs-panel {
            padding: 1.4rem 1.6rem;
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .tabs-panel[role="tabpanel"] {
            display: none;
        }
        .tabs-panel.is-active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Experience Items ===== */
        .exp-item {
            margin-bottom: 1.6rem;
        }
        .exp-item:last-child {
            margin-bottom: 0;
        }

        .exp-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 0.3rem;
        }
        .exp-header .exp-company {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .exp-header .exp-role {
            font-weight: 600;
            color: var(--color-text-secondary);
            font-size: 0.95rem;
        }
        .exp-header .exp-date {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            font-weight: 500;
            background: var(--color-border);
            padding: 0.1rem 0.8rem;
            border-radius: 20px;
        }
        [data-theme="dark"] .exp-header .exp-date {
            background: #334155;
        }

        .exp-details {
            list-style: none;
            padding-left: 0;
            margin-top: 0.4rem;
        }
        .exp-details li {
            position: relative;
            padding-left: 1.2rem;
            margin-bottom: 0.25rem;
            font-size: 0.93rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
        }
        .exp-details li::before {
            content: '▹';
            position: absolute;
            left: 0;
            color: var(--color-accent);
            font-weight: 700;
        }
        .exp-details li strong {
            color: var(--color-text);
            font-weight: 600;
        }
        [data-theme="dark"] .exp-details li strong {
            color: #f1f5f9;
        }

        /* ===== Project Cards (inside tabs) ===== */
        .project-card {
            background: var(--color-bg);
            border-radius: var(--radius-sm);
            padding: 1rem 1.2rem;
            margin-bottom: 1rem;
            border-left: 3px solid var(--color-accent);
            transition: all var(--transition);
        }
        .project-card:last-child {
            margin-bottom: 0;
        }
        .project-card:hover {
            background: var(--color-border);
        }
        [data-theme="dark"] .project-card {
            background: #0f172a;
        }
        [data-theme="dark"] .project-card:hover {
            background: #1e293b;
        }

        .project-card .proj-title {
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.4rem 0.8rem;
        }
        .project-card .proj-title .proj-role {
            font-weight: 500;
            color: var(--color-text-secondary);
            font-size: 0.85rem;
        }
        .project-card .proj-title .proj-date {
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            background: var(--color-border);
            padding: 0.05rem 0.7rem;
            border-radius: 20px;
        }
        [data-theme="dark"] .project-card .proj-title .proj-date {
            background: #334155;
        }

        .project-card .proj-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 0.5rem;
            margin: 0.3rem 0 0.3rem;
        }
        .project-card .proj-tech .tech-tag {
            font-size: 0.7rem;
            background: var(--color-accent);
            color: #fff;
            padding: 0.1rem 0.6rem;
            border-radius: 12px;
            font-weight: 500;
        }

        .project-card .proj-details {
            list-style: none;
            padding-left: 0;
            margin-top: 0.2rem;
        }
        .project-card .proj-details li {
            position: relative;
            padding-left: 1.1rem;
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
            margin-bottom: 0.1rem;
        }
        .project-card .proj-details li::before {
            content: '◆';
            position: absolute;
            left: 0;
            color: var(--color-gold);
            font-size: 0.6rem;
            top: 0.15rem;
        }

        /* ===== Skills Matrix ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.2rem 2rem;
        }
        .skill-category h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.4rem;
        }
        .skill-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.3rem;
        }
        .skill-row .skill-name {
            font-size: 0.88rem;
            font-weight: 500;
            min-width: 72px;
            color: var(--color-text);
        }
        .skill-row .skill-bar {
            flex: 1;
            height: 6px;
            background: var(--color-border);
            border-radius: 4px;
            overflow: hidden;
        }
        .skill-row .skill-bar .fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--color-accent), #7c3aed);
            transition: width 0.6s ease;
            width: 0;
        }
        .skill-row .skill-level {
            font-size: 0.7rem;
            color: var(--color-text-secondary);
            font-weight: 500;
            min-width: 36px;
            text-align: right;
        }

        /* ===== Education & Awards ===== */
        .edu-awards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.6rem;
        }
        @media (max-width: 700px) {
            .edu-awards-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
        }

        .edu-item {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 1.2rem 1.4rem;
            transition: all var(--transition);
        }
        .edu-item:hover {
            box-shadow: 0 4px 16px var(--color-shadow);
        }
        .edu-item .edu-school {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .edu-item .edu-major {
            font-weight: 500;
            color: var(--color-text-secondary);
        }
        .edu-item .edu-meta {
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            margin: 0.1rem 0 0.3rem;
        }
        .edu-item .edu-details {
            list-style: none;
            padding-left: 0;
            font-size: 0.88rem;
            color: var(--color-text-secondary);
        }
        .edu-item .edu-details li {
            position: relative;
            padding-left: 1rem;
            margin-bottom: 0.1rem;
        }
        .edu-item .edu-details li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--color-accent);
        }

        .awards-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .award-item {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 0.6rem 1rem;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            transition: all var(--transition);
        }
        .award-item:hover {
            border-color: var(--color-accent);
        }
        .award-item .award-name {
            font-weight: 600;
            font-size: 0.92rem;
        }
        .award-item .award-issuer {
            font-size: 0.78rem;
            color: var(--color-text-secondary);
        }
        .award-item .award-date {
            font-size: 0.72rem;
            color: var(--color-text-secondary);
            background: var(--color-border);
            padding: 0.05rem 0.7rem;
            border-radius: 20px;
        }
        [data-theme="dark"] .award-item .award-date {
            background: #334155;
        }

        /* ===== Footer ===== */
        .footer {
            padding: 1.6rem 0;
            border-top: 1px solid var(--color-border);
            text-align: center;
            font-size: 0.8rem;
            color: var(--color-text-secondary);
            margin-top: 1rem;
        }

        /* ===== Back to Top ===== */
        .back-top {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--color-accent);
            color: #fff;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.35);
            transition: all var(--transition);
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-top.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .back-top:hover {
            background: var(--color-accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(59, 130, 246, 0.45);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--color-text);
            color: var(--color-bg);
            padding: 0.5rem 1.6rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 2000;

        // --- Experience Tabs ---

            const header = document.getElementById('expTabsHeader');

            const items = resume.experience;
            if (!items.length) {
                header.innerHTML = '';
                panels.innerHTML = '<div class="tabs-panel is-active" role="tabpanel">暂无经历</div>';
                return;
            }

            // Header buttons
            header.innerHTML = items.map((exp, idx) =>
                `<button role="tab" aria-selected="${idx === 0 ? 'true' : 'false'}" aria-controls="exp-panel-${idx}" id="exp-tab-${idx}" tabindex="${idx === 0 ? '0' : '-1'}">
                    ${exp.company}
                </button>`
            ).join('');

            // Panels
            panels.innerHTML = items.map((exp, idx) =>
                `<div class="tabs-panel ${idx === 0 ? 'is-active' : ''}" role="tabpanel" id="exp-panel-${idx}" aria-labelledby="exp-tab-${idx}">
                    <div class="exp-item">
                        <div class="exp-header">

                            <span class="exp-role">${exp.role}</span>
                            <span class="exp-date">${exp.date}</span>

                        <ul class="exp-details">
                            ${exp.details.map(d => `<li>${d}</li>`).join('')}
                        </ul>
                    </div>
                </div>`
            ).join('');

            // Tab logic
            const tabs = header.querySelectorAll('button');
            const panelsList = panels.querySelectorAll('.tabs-panel');

            function activateTab(idx) {
                tabs.forEach((t, i) => {
                    t.setAttribute('aria-selected', i === idx ? 'true' : 'false');
                    t.setAttribute('tabindex', i === idx ? '0' : '-1');
                });
                panelsList.forEach((p, i) => {
                    p.classList.toggle('is-active', i === idx);
                });
            }

            tabs.forEach((tab, idx) => {
                tab.addEventListener('click', () => activateTab(idx));
                tab.addEventListener('keydown', (e) => {
                    let newIdx = idx;
                    if (e.key === 'ArrowRight') newIdx = (idx + 1) % tabs.length;
                    else if (e.key === 'ArrowLeft') newIdx = (idx - 1 + tabs.length) % tabs.length;
                    else return;
                    e.preventDefault();
                    tabs[newIdx].focus();
                    activateTab(newIdx);
                });
            });
        }

        // --- Theme Toggle ---
        function initTheme() {
            const btn = document.getElementById('themeToggle');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let dark = localStorage.getItem('theme-dark') === 'true' || (localStorage.getItem('theme-dark') === null && prefersDark);
            applyTheme(dark);

            btn.addEventListener('click', () => {
                dark = !dark;
                applyTheme(dark);
                localStorage.setItem('theme-dark', String(dark));
            });

            function applyTheme(d) {
                document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
                btn.textContent = d ? '☀️' : '🌓';
            }
        }

        // --- Back to Top ---
        function initBackTop() {
            const btn = document.getElementById('backTop');
            let visible = false;

            window.addEventListener('scroll', () => {
                const y = window.scrollY;
                if (y > 400 && !visible) {
                    visible = true;
                    btn.classList.add('visible');
                } else if (y <= 400 && visible) {
                    visible = false;
                    btn.classList.remove('visible');
                }
            });

            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // --- Init ---

            renderHeroTags();
            renderHeroContact();
            renderHeroStats();
            renderHighlights();
            renderExperience();
            renderProjects();
            renderSkills();
            renderEducation();
            renderAwards();
            initTheme();
